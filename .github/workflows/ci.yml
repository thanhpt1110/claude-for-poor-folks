name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci
      # Types are checked, never emitted: what ships is exactly what was written.
      - run: npm run typecheck
      - run: npm test
      - run: node test/bench.js
