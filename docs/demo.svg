<g class="f f0"><text x="26" y="74" fill="#58a6ff">$ </text><text x="42.84" y="74" fill="#c9d1d9">npm i -g claude-for-poor-folks &amp;&amp; claude-for-poor-folks init</text><text x="26" y="118" fill="#f0f6fc" font-weight="600">  claude-for-poor-folks </text><text x="228.07999999999998" y="118" fill="#6e7681">— budget gate for </text><text x="379.64" y="118" fill="#c9d1d9">payments-api</text><text x="26" y="140" fill="#6e7681">  Asked once per repo. Everything stays local.</text><text x="26" y="184" fill="#c9d1d9">  1) Default profile for this repo (or blank = auto): </text><text x="480.68" y="184" fill="#3fb950">auto</text><text x="26" y="206" fill="#c9d1d9">  2) Session budget in USD (blank = profile default):  </text><text x="489.1" y="206" fill="#3fb950">profile</text><text x="26" y="228" fill="#c9d1d9">  3) When a limit is hit — warn / ask:                 </text><text x="489.1" y="228" fill="#3fb950">warn</text><text x="26" y="272" fill="#3fb950">  saved </text><text x="93.36" y="272" fill="#6e7681">.poor-folks.json</text></g>
